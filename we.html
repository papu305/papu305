<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #007bff;
            color: white;
            padding: 20px;
        }
        .content {
            padding: 50px;
        }
        .footer {
            background: #333;
            color: white;
            padding: 10px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Welcome to My Website</h1>
    </div>

    <div class="content">
        <p>This is a simple website hosted online!</p>
    </div>

    <div class="footer">
        <p>© 2025 My Website</p>
    </div>

</body>
</html>
